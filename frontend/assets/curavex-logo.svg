<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="logoBgGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#070b14"/>
    </linearGradient>

    <!-- Bio-therapeutic Gradient -->
    <linearGradient id="bioGradH" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <!-- Vector Gradient -->
    <linearGradient id="vectorGradH" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="60%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>

    <filter id="markGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="200" rx="24" fill="url(#logoBgGrad)"/>
  <rect width="798" height="198" x="1" y="1" rx="23" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1.5"/>

  <!-- Brand Mark (Left Column) -->
  <g transform="translate(110, 100) scale(0.48)">
    <!-- Base Icon Container (radius=48) -->
    <rect x="-140" y="-140" width="280" height="280" rx="64" fill="#0f172a" stroke="rgba(255,255,255,0.1)" stroke-width="2"/>
    <circle cx="0" cy="0" r="95" fill="url(#bioGradH)" opacity="0.15"/>

    <!-- Left Arc: C Shape -->
    <path d="M -25,-85 
             C -70,-85 -95,-55 -95,0 
             C -95,55 -70,85 -25,85 
             C 10,85 35,70 50,45
             C 40,40 35,35 30,30
             C 18,50 -2,62 -25,62
             C -55,62 -68,38 -68,0
             C -68,-38 -55,-62 -25,-62
             C -2,-62 18,-50 30,-30
             C 35,-35 40,-40 50,-45
             C 35,-70 10,-85 -25,-85 Z" 
          fill="url(#bioGradH)" filter="url(#markGlow)"/>

    <!-- Right Interlocking Vector -->
    <path d="M 25,-80 
             L 80,-80 
             C 95,-80 100,-70 95,-60 
             L 40,25 
             L 90,25 
             C 100,25 105,35 95,45 
             L 35,90 
             L -15,90 
             C -30,90 -35,80 -25,70 
             L 25,-10 
             L -25,-10 
             C -35,-10 -40,-20 -30,-30 
             L 15,-75 
             C 18,-78 22,-80 25,-80 Z" 
          fill="url(#vectorGradH)"/>

    <!-- Center Pulse Node -->
    <circle cx="5" cy="5" r="10" fill="#ffffff"/>
    <circle cx="5" cy="5" r="6" fill="#06b6d4"/>
  </g>

  <!-- Typography Lockup (Right Column) -->
  <g transform="translate(225, 0)">
    <!-- Wordmark: CURAVEX -->
    <text x="0" y="112" font-family="'Inter', -apple-system, sans-serif" font-size="58" font-weight="800" letter-spacing="4" fill="#ffffff">
      CURA<tspan fill="#38bdf8">VEX</tspan>
    </text>

    <!-- Category Pill Badge -->
    <g transform="translate(365, 75)">
      <rect width="130" height="26" rx="6" fill="rgba(6, 182, 212, 0.12)" stroke="rgba(6, 182, 212, 0.35)" stroke-width="1"/>
      <text x="65" y="17" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" letter-spacing="1.5" fill="#38bdf8" text-anchor="middle">
        MLOPS SAAS
      </text>
    </g>

    <!-- Tagline Subtitle -->
    <text x="2" y="142" font-family="'Inter', -apple-system, sans-serif" font-size="13.5" font-weight="500" letter-spacing="1.2" fill="#94a3b8">
      CLINICAL TREATMENT RESPONSE &amp; EFFICACY GOVERNANCE
    </text>
  </g>
</svg>
