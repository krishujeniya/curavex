<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 260" width="960" height="260">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="logo-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1114"/>
      <stop offset="100%" stop-color="#070b0e"/>
    </linearGradient>

    <!-- Bio-molecular Precision Gradient -->
    <linearGradient id="logo-core" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7ee7d2"/>
      <stop offset="50%" stop-color="#4fd1b5"/>
      <stop offset="100%" stop-color="#229e84"/>
    </linearGradient>

    <!-- Mathematical Regression Vector Gradient -->
    <linearGradient id="logo-accent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
  </defs>

  <!-- Container -->
  <rect width="960" height="260" rx="36" fill="url(#logo-bg)"/>
  <rect width="956" height="256" x="2" y="2" rx="34" fill="none" stroke="rgba(215, 232, 226, 0.12)" stroke-width="2"/>

  <!-- Left Side: Integrated Mark (Centered at 130, 130) -->
  <g transform="translate(130, 130) scale(0.48)">
    <circle cx="0" cy="0" r="172" fill="none" stroke="rgba(143, 214, 197, 0.15)" stroke-width="2" stroke-dasharray="4 8"/>
    <line x1="-190" y1="0" x2="-155" y2="0" stroke="rgba(143, 214, 197, 0.4)" stroke-width="2"/>
    <line x1="155" y1="0" x2="190" y2="0" stroke="rgba(143, 214, 197, 0.4)" stroke-width="2"/>
    <line x1="0" y1="-190" x2="0" y2="-155" stroke="rgba(143, 214, 197, 0.4)" stroke-width="2"/>
    <line x1="0" y1="155" x2="0" y2="190" stroke="rgba(143, 214, 197, 0.4)" stroke-width="2"/>

    <!-- 'C' Ring -->
    <path d="M 45, -125 C -65, -125 -135, -75 -135, 0 C -135, 75 -65, 125 45, 125 C 95, 125 130, 95 140, 68 C 125, 68 115, 60 105, 48 C 85, 78 55, 90 28, 90 C -50, 90 -95, 50 -95, 0 C -95, -50 -50, -90 28, -90 C 55, -90 85, -78 105, -48 C 115, -60 125, -68 140, -68 C 130, -95 95, -125 45, -125 Z" fill="url(#logo-core)"/>
    
    <!-- 'V' Vector -->
    <path d="M 60, -98 L 142, 60 C 148, 72 138, 86 124, 86 L 92, 86 C 84, 86 77, 81 73, 73 L 24, -22 L 5, 18 C 1, 26 -6, 32 -14, 32 L -36, 32 C -44, 32 -50, 24 -46, 16 L 18, -94 C 22, -102 31, -106 39, -106 L 48, -106 C 54, -106 58, -102 60, -98 Z" fill="url(#logo-accent)"/>

    <!-- Central Node -->
    <g transform="translate(14, 2)">
      <circle cx="0" cy="0" r="18" fill="#0b1316" stroke="rgba(126, 231, 210, 0.5)" stroke-width="2"/>
      <path d="M -3, -9 L 3, -9 L 3, -3 L 9, -3 L 9, 3 L 3, 3 L 3, 9 L -3, 9 L -3, 3 L -9, 3 L -9, -3 L -3, -3 Z" fill="#7ee7d2"/>
    </g>
  </g>

  <!-- Typography Wordmark -->
  <g transform="translate(260, 142)">
    <text font-family="Inter, -apple-system, system-ui, sans-serif" font-weight="800" font-size="74" letter-spacing="-1.5" fill="#f8fafc">
      CURA<tspan fill="#7ee7d2">VEX</tspan>
    </text>
    <rect x="330" y="-56" width="170" height="26" rx="6" fill="#132325" stroke="rgba(126, 231, 210, 0.35)" stroke-width="1.2"/>
    <text x="342" y="-38" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="12" fill="#7ee7d2" letter-spacing="1.2">
      CLINICAL MLOPS
    </text>
    <text x="2" y="32" font-family="Inter, -apple-system, system-ui, sans-serif" font-weight="500" font-size="19" fill="#94a3b8" letter-spacing="0.2">
      Treatment Response Regression &amp; Efficacy Governance
    </text>
  </g>
</svg>
