services:
  curavex-saas:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    container_name: curavex
    restart: unless-stopped
    ports:
      - "8000:8000"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    env_file:
      - path: ../../.env
        required: false
    environment:
      - PORT=8000
      - PYTHONUNBUFFERED=1
    volumes:
      - ../../backend/models/registry:/app/models/registry
      - ../../backend/logs:/app/logs
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
