<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Crisp Clinical Surface Gradients -->
    <linearGradient id="cv-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#000000"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>

    <!-- Bio-molecular Precision Gradient -->
    <linearGradient id="cv-core" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#e4e4e7"/>
      <stop offset="100%" stop-color="#d4d4d8"/>
    </linearGradient>

    <!-- Mathematical Regression Vector Gradient -->
    <linearGradient id="cv-accent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
  </defs>

  <!-- Shell Base (Rounded Clinical Capsule with exact border ratio) -->
  <rect width="512" height="512" rx="96" fill="url(#cv-bg)"/>
  <rect width="506" height="506" x="3" y="3" rx="93" fill="none" stroke="rgba(215, 232, 226, 0.16)" stroke-width="2.5"/>

  <!-- Geometric Molecular Graph Coordinate Network -->
  <g transform="translate(256, 256)">
    <!-- Outer Precision Target Orbit (Technical Calibration Mark) -->
    <circle cx="0" cy="0" r="172" fill="none" stroke="rgba(143, 214, 197, 0.12)" stroke-width="1.5" stroke-dasharray="4 8"/>
    
    <!-- Coordinate Axis Subdivisions -->
    <line x1="-190" y1="0" x2="-155" y2="0" stroke="rgba(143, 214, 197, 0.3)" stroke-width="2"/>
    <line x1="155" y1="0" x2="190" y2="0" stroke="rgba(143, 214, 197, 0.3)" stroke-width="2"/>
    <line x1="0" y1="-190" x2="0" y2="-155" stroke="rgba(143, 214, 197, 0.3)" stroke-width="2"/>
    <line x1="0" y1="155" x2="0" y2="190" stroke="rgba(143, 214, 197, 0.3)" stroke-width="2"/>

    <!-- Primary Glyph Segment 1: The 'C' Molecular Ring (Curative Arc) -->
    <path d="M 45, -125
             C -65, -125 -135, -75 -135, 0
             C -135, 75 -65, 125 45, 125
             C 95, 125 130, 95 140, 68
             C 125, 68 115, 60 105, 48
             C 85, 78 55, 90 28, 90
             C -50, 90 -95, 50 -95, 0
             C -95, -50 -50, -90 28, -90
             C 55, -90 85, -78 105, -48
             C 115, -60 125, -68 140, -68
             C 130, -95 95, -125 45, -125 Z"
          fill="url(#cv-core)"/>

    <!-- Primary Glyph Segment 2: The 'V' Vector Convergence (Validation / Vector) -->
    <path d="M 60, -98
             L 142, 60
             C 148, 72 138, 86 124, 86
             L 92, 86
             C 84, 86 77, 81 73, 73
             L 24, -22
             L 5, 18
             C 1, 26 -6, 32 -14, 32
             L -36, 32
             C -44, 32 -50, 24 -46, 16
             L 18, -94
             C 22, -102 31, -106 39, -106
             L 48, -106
             C 54, -106 58, -102 60, -98 Z"
          fill="url(#cv-accent)"/>

    <!-- Cross-Disciplinary Node: Precision Medical Cross Diamond Center -->
    <g transform="translate(14, 2)">
      <!-- Outer Node Shield -->
      <circle cx="0" cy="0" r="18" fill="#0b1316" stroke="rgba(126, 231, 210, 0.4)" stroke-width="2"/>
      <!-- Clinical Cross Core Indicator -->
      <path d="M -3, -9 L 3, -9 L 3, -3 L 9, -3 L 9, 3 L 3, 3 L 3, 9 L -3, 9 L -3, 3 L -9, 3 L -9, -3 L -3, -3 Z" fill="#7ee7d2"/>
    </g>

    <!-- Satellite Pharmacodynamic Reference Nodes -->
    <circle cx="-135" cy="-55" r="5.5" fill="#7ee7d2" stroke="#080d0f" stroke-width="1.5"/>
    <circle cx="-135" cy="55" r="5.5" fill="#4fd1b5" stroke="#080d0f" stroke-width="1.5"/>
    <circle cx="120" cy="-90" r="4.5" fill="#60a5fa" stroke="#080d0f" stroke-width="1.5"/>
    <circle cx="112" cy="100" r="4.5" fill="#2dd4bf" stroke="#080d0f" stroke-width="1.5"/>
  </g>
</svg>
